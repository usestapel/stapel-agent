[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stapel-agent"
version = "0.19.1"
description = "LLM facade Django app for the Stapel framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["django", "stapel", "llm", "anthropic", "openai", "translation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    # >=0.24.0 for stapel_core.net — the fleet's single SSRF-hardened fetcher
    # (https-only, every resolved address validated, the socket pinned to that
    # IP, every redirect re-validated, body capped mid-stream, total deadline).
    # stt/base.py imports `fetch_bytes` / `SafeFetchError` from it on the
    # AudioRef.read_bytes path, which is the fix for AGENT-01; without that
    # module the package does not import at all.
    #
    # This floor was knowingly WRONG until now, and said so in the commit that
    # introduced the import: `stapel_core.net` existed only on core's
    # sec/audit-2026-08-11 branch, so no released core contained it and no
    # honest floor could be written. Core 0.24.0 is the release that ships it
    # (v0.24.0 is the first — and only — tag containing that module), so this
    # is the first version of stapel-agent whose declared floor is true.
    #
    # It also covers the second dependency this audit created: CACHE_POLICY is
    # an `import_strings` key, and core 0.24.0 makes such keys implicitly
    # `no_env`, so an environment variable cannot pick the class that mediates
    # the now tenant-scoped prompt cache. This package's own conf.NO_ENV list
    # closes the same door for the keys core cannot know about.
    #
    # Superseded floors, both still satisfied: >=0.15.11 for
    # stapel_core.schema_strict (the strict-subset transform the
    # OpenAI-compatible transport applies before every constrained call).
    "stapel-core>=0.24.0,<1.0",
    # Provider-response validation and LLM-authored contracts are declared
    # as pydantic models. This is deliberate rather than incidental: the
    # models being ported in carry `extra="forbid"` plus field/model
    # validators whose exact behaviour IS the contract — an unknown field
    # must fail loudly, not be dropped. Re-expressing them as dataclasses
    # or DRF serializers would silently change what "valid" means.
    "pydantic>=2,<3",
]

[project.urls]
Homepage = "https://github.com/usestapel/stapel-agent"
Repository = "https://github.com/usestapel/stapel-agent"
Documentation = "https://github.com/usestapel/stapel-agent#readme"
Changelog = "https://github.com/usestapel/stapel-agent/blob/main/CHANGELOG.md"
Issues = "https://github.com/usestapel/stapel-agent/issues"

[project.optional-dependencies]
anthropic = ["anthropic>=0.34"]
# SOCKS for OPENAI_COMPAT_PROXY — requests learns socks5h:// only from PySocks.
socks = ["PySocks>=1.7"]
all = ["stapel-agent[anthropic,socks]"]

[tool.setuptools]
package-dir = {"stapel_agent" = "."}
# Hand-maintained, and therefore guarded: tests/test_packaging.py fails when
# a directory with an __init__.py is missing here. A forgotten entry does not
# break anything locally — it only ships a wheel with the module absent, and
# the first sign is an ImportError in someone else's deployment.
packages = ["stapel_agent", "stapel_agent.diarization", "stapel_agent.diarization.pricing", "stapel_agent.diarization.providers", "stapel_agent.diarization.validation", "stapel_agent.embeddings", "stapel_agent.embeddings.providers", "stapel_agent.images", "stapel_agent.images.providers", "stapel_agent.management", "stapel_agent.management.commands", "stapel_agent.migrations", "stapel_agent.providers", "stapel_agent.rerank", "stapel_agent.rerank.providers", "stapel_agent.safety", "stapel_agent.stt", "stapel_agent.stt.pricing", "stapel_agent.stt.providers", "stapel_agent.stt.validation"]

[tool.setuptools.package-data]
stapel_agent = ["py.typed", "migrations/*.py", "schemas/**/*.json", "migrations/**/*.py", "docs/capabilities.json", "docs/llms.txt", "docs/flows.json", "docs/errors.json", "CONFIG.MD"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Single source for the git hooks and CI (they pass the same flags on the CLI).
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
django_find_project = false
addopts = "--tb=short -q --import-mode=importlib"

[tool.coverage.run]
# Measure the shipped library code only: the packaged test suite, its
# conftest and the migration files are distributed for reuse but are not
# runtime code exercised by the host project.
omit = [
    "*/tests/*",
    "*/conftest.py",
    "*/migrations/*",
]
