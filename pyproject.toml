[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stapel-agent"
version = "0.6.6"
description = "LLM facade Django app for the Stapel framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["django", "stapel", "llm", "anthropic", "openai", "translation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "stapel-core>=0.10,<1.0",
    # Provider-response validation and LLM-authored contracts are declared
    # as pydantic models. This is deliberate rather than incidental: the
    # models being ported in carry `extra="forbid"` plus field/model
    # validators whose exact behaviour IS the contract — an unknown field
    # must fail loudly, not be dropped. Re-expressing them as dataclasses
    # or DRF serializers would silently change what "valid" means.
    "pydantic>=2,<3",
]

[project.urls]
Homepage = "https://github.com/usestapel/stapel-agent"
Repository = "https://github.com/usestapel/stapel-agent"
Documentation = "https://github.com/usestapel/stapel-agent#readme"
Changelog = "https://github.com/usestapel/stapel-agent/blob/main/CHANGELOG.md"
Issues = "https://github.com/usestapel/stapel-agent/issues"

[project.optional-dependencies]
anthropic = ["anthropic>=0.34"]
all = ["stapel-agent[anthropic]"]

[tool.setuptools]
package-dir = {"stapel_agent" = "."}
# Hand-maintained, and therefore guarded: tests/test_packaging.py fails when
# a directory with an __init__.py is missing here. A forgotten entry does not
# break anything locally — it only ships a wheel with the module absent, and
# the first sign is an ImportError in someone else's deployment.
packages = ["stapel_agent", "stapel_agent.diarization", "stapel_agent.diarization.pricing", "stapel_agent.diarization.providers", "stapel_agent.diarization.validation", "stapel_agent.embeddings", "stapel_agent.embeddings.providers", "stapel_agent.images", "stapel_agent.images.providers", "stapel_agent.migrations", "stapel_agent.providers", "stapel_agent.rerank", "stapel_agent.rerank.providers", "stapel_agent.safety", "stapel_agent.stt", "stapel_agent.stt.pricing", "stapel_agent.stt.providers", "stapel_agent.stt.validation"]

[tool.setuptools.package-data]
stapel_agent = ["py.typed", "migrations/*.py", "schemas/**/*.json", "migrations/**/*.py"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Single source for the git hooks and CI (they pass the same flags on the CLI).
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
django_find_project = false
addopts = "--tb=short -q --import-mode=importlib"

[tool.coverage.run]
# Measure the shipped library code only: the packaged test suite, its
# conftest and the migration files are distributed for reuse but are not
# runtime code exercised by the host project.
omit = [
    "*/tests/*",
    "*/conftest.py",
    "*/migrations/*",
]
